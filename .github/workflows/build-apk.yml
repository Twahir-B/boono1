name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Build debug APK
        working-directory: .
        run: |
          chmod +x gradlew || true
          # Use system gradle if wrapper incomplete
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar) -lt 40000 ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" || gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
